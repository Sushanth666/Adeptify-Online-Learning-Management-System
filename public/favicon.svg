<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes capMotion {
      0%, 100% {
        transform: rotate(-6deg) translateY(0px);
      }
      50% {
        transform: rotate(6deg) translateY(-2px);
      }
    }
    @keyframes tasselMotion {
      0%, 100% {
        transform: rotate(-15deg);
      }
      50% {
        transform: rotate(20deg);
      }
    }
    @keyframes pulseAura {
      0%, 100% {
        transform: scale(0.98);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
    }
    .badge-bg {
      transform-origin: 32px 32px;
      animation: pulseAura 2s ease-in-out infinite;
    }
    .cap-group {
      transform-origin: 32px 32px;
      animation: capMotion 2s ease-in-out infinite;
    }
    .tassel {
      transform-origin: 32px 28px;
      animation: tasselMotion 1.5s ease-in-out infinite;
    }
  </style>
  
  <!-- Outer Rounded Square with Gradient -->
  <rect class="badge-bg" x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Cap Group with Swing Motion -->
  <g class="cap-group">
    <!-- Top Diamond / Mortarboard -->
    <polygon points="32,16 52,26 32,36 12,26" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5" />
    
    <!-- Skullcap Base -->
    <path d="M20,30 L20,38 C20,44 44,44 44,38 L44,30 C39,34 25,34 20,30 Z" fill="#d1fae5" />
    
    <!-- Tassel with Swing Motion -->
    <g class="tassel">
      <path d="M32,26 Q46,28 47,42" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
      <circle cx="47" cy="42" r="3" fill="#f59e0b" />
    </g>
    
    <!-- Center Button -->
    <circle cx="32" cy="26" r="2.5" fill="#e0e7ff" />
  </g>
</svg>
